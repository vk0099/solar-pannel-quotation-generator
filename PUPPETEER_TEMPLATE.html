
<!DOCTYPE html>
<html>
<head>
    <style>
        /* PDF specific styling */
        :root {
            --primary: #22c55e;
            --secondary: #1e3a8a;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica', sans-serif;
            -webkit-print-color-adjust: exact;
        }

        .page {
            width: 210mm;
            height: 297mm;
            padding: 20mm;
            box-sizing: border-box;
            page-break-after: always;
            position: relative;
        }

        .header {
            border-bottom: 4px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
        }

        .brand {
            color: var(--secondary);
            font-size: 24px;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .stat-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid var(--primary);
        }

        .footer-note {
            position: absolute;
            bottom: 20mm;
            left: 20mm;
            right: 20mm;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div class="brand">AASHIKA SOLAR</div>
            <div style="text-align: right; font-size: 12px;">QUOTATION: #ASS-2024-099</div>
        </div>

        <h1>Solar Power Plant Quotation</h1>
        <p>Prepared for: <strong>Sri Kanama Venkatarami Reddy</strong></p>

        <div class="stats-grid">
            <div class="stat-card">
                <div style="font-size: 12px; color: #64748b;">System Capacity</div>
                <div style="font-size: 20px; font-weight: bold;">5.0 KW</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 12px; color: #64748b;">Daily Production</div>
                <div style="font-size: 20px; font-weight: bold;">25 Units</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 12px; color: #64748b;">Total Net Investment</div>
                <div style="font-size: 20px; font-weight: bold;">₹2,45,000</div>
            </div>
            <div class="stat-card">
                <div style="font-size: 12px; color: #64748b;">Annual Savings</div>
                <div style="font-size: 20px; font-weight: bold;">₹72,000</div>
            </div>
        </div>

        <div class="footer-note">
            This is a computer-generated quotation and does not require a physical signature.
        </div>
    </div>
</body>
</html>
